[package]
name = "docx-cli-render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "docx-cli rasteriser: pages and thumbnails from the layout display list (vello_cpu), PNG/JPEG export"

[lints]
workspace = true

[dependencies]
docx-cli-geom = { workspace = true }
docx-cli-doc = { workspace = true }
docx-cli-fonts = { workspace = true }
docx-cli-layout = { workspace = true }
docx-cli-metafile = { workspace = true }
vello_cpu = { workspace = true }
image = { workspace = true }
log = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
vello_cpu = { workspace = true, features = ["multithreading"] }
