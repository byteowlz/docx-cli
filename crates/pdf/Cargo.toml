[package]
name = "docx-cli-pdf"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "docx-cli PDF export (craft-pdf / Krilla): embedded font subsets with selectable text, links, outline, tagging"

[lints]
workspace = true

[dependencies]
docx-cli-doc = { workspace = true }
docx-cli-geom = { workspace = true }
docx-cli-fonts = { workspace = true }
docx-cli-layout = { workspace = true }
docx-cli-metafile = { workspace = true }
craft-pdf = { workspace = true }
kurbo = { workspace = true }
image = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The browser clock (`SystemTime::now()` panics on wasm32).
js-sys = "0.3"

[dev-dependencies]
hayro-syntax = "0.7.2"
hayro-interpret = { version = "0.7.0", default-features = false, features = ["embed-fonts"] }
hayro-cmap = "0.1"
